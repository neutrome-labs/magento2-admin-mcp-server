[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magento2-admin-mcp-server"
version = "1.0.0"
description = "Magento 2 Admin MCP Server — stateless OAuth 2.0 token proxy over FastMCP v3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Neutrome Labs" }]

dependencies = [
    "fastmcp>=3.0.2",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=43.0",
    "PyJWT>=2.9",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
prod = [
    "gunicorn>=22.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
