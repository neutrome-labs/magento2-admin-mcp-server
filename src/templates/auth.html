<!DOCTYPE html>
<html lang="en">
<head>
    <title>Connect to Magento · {{MCP_TITLE}}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --fg: #f4f4f5;
            --muted: #71717a;
            --muted-fg: #a1a1aa;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #f26322;
            --accent-foreground: #ffffff;
            --card: rgba(18, 18, 20, 0.6);
            --input: rgba(255, 255, 255, 0.03);
            --ring: rgba(242, 99, 34, 0.3);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Background Mesh & Noise */
        .bg-visuals {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .mesh {
            position: absolute;
            width: 140%;
            height: 140%;
            top: -20%;
            left: -20%;
            background-image: 
                radial-gradient(at 0% 0%, rgba(242, 99, 34, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(242, 99, 34, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(124, 58, 237, 0.05) 0px, transparent 50%);
            filter: blur(80px);
            animation: mesh-float 20s ease-in-out infinite alternate;
        }

        @keyframes mesh-float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }

        .noise {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px 6px 6px;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 14px;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .logo-box {
            display: flex;
            padding: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: var(--accent);
        }

        .logo-box svg {
            width: 24px;
            height: 24px;
        }

        .client-name-header {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--fg);
            letter-spacing: -0.01em;
        }

        .header h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 2.5rem;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--muted-fg);
            font-size: 1rem;
            max-width: 320px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Card */
        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.03),
                0 20px 48px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.2s; }
        .form-group:nth-child(2) { animation-delay: 0.3s; }
        .form-group:nth-child(3) { animation-delay: 0.4s; }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--muted-fg);
        }

        .input-control {
            position: relative;
        }

        input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            padding-left: 2.75rem;
            color: var(--fg);
            font-family: 'Instrument Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input#magentoToken {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px var(--ring);
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 55%;
            transform: translateY(-51%);
            color: var(--muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        input:focus + .input-icon,
        .input-control:focus-within .input-icon {
            color: var(--accent);
        }

        .hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.5rem;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: var(--accent-foreground);
            border: none;
            border-radius: var(--radius);
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(242, 99, 34, 0.4);
            filter: brightness(1.1);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            transition: 0.5s;
            left: -100%;
        }

        .submit-btn:hover::after {
            left: 100%;
        }

        /* Footer */
        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            opacity: 0;
            animation: fade-in 1s ease 0.6s forwards;
        }

        .footer a {
            color: var(--muted-fg);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: var(--accent);
        }

        /* Animations */
        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Loading State */
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading .loading-spinner {
            display: block;
        }

        .btn-loading span, .btn-loading svg {
            display: none;
        }

        /* Password Toggle */
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 1rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-visuals">
        <div class="mesh"></div>
        <div class="noise"></div>
    </div>

    <main class="container">
        <header class="header">
            <div class="logo-container">
                <div class="logo-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                        <line x1="3" y1="6" x2="21" y2="6"/>
                        <path d="M16 10a4 4 0 01-8 0"/>
                    </svg>
                </div>
                <span class="client-name-header">{{CLIENT_NAME}}</span>
            </div>
            <h1>Magento Supercharge</h1>
            <p>Connect your store to unlock AI-driven commerce.</p>
        </header>

        <div class="card">
            <form method="POST" action="/authorize" id="authForm">
                <div class="form-group">
                    <label for="baseUrl">Store URL</label>
                    <div class="input-control">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                <circle cx="12" cy="12" r="10"/>
                                <line x1="2" y1="12" x2="22" y2="12"/>
                                <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
                            </svg>
                        </span>
                        <input 
                            type="url" 
                            id="baseUrl" 
                            name="baseUrl" 
                            placeholder="https://awesomeshop.com" 
                            required 
                            autocomplete="url"
                            spellcheck="false"
                        />
                    </div>
                    <p class="hint">The base URL of your Magento 2 store</p>
                </div>

                <div class="form-group">
                    <label for="magentoToken">Access Token</label>
                    <div class="input-control">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                            </svg>
                        </span>
                        <input 
                            type="password" 
                            id="magentoToken" 
                            name="magentoToken" 
                            placeholder="Your integration token" 
                            required 
                            autocomplete="current-password"
                        />
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <p class="hint">System → Integrations → Access Token</p>
                </div>

                <input type="hidden" name="client_id" value="{{CLIENT_ID}}" />
                <input type="hidden" name="redirect_uri" value="{{REDIRECT_URI}}" />
                <input type="hidden" name="code_challenge" value="{{CODE_CHALLENGE}}" />
                <input type="hidden" name="code_challenge_method" value="{{CODE_CHALLENGE_METHOD}}" />
                <input type="hidden" name="state" value="{{STATE}}" />
                <input type="hidden" name="scope" value="{{SCOPE}}" />

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span>Connect</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                    <div class="loading-spinner"></div>
                </button>
            </form>
        </div>

        <footer class="footer">
            <p>Securely powered by <a href="https://github.com/neutrome-labs/magento2-admin-mcp-server-v2" target="_blank">Neutrome Labs</a></p>
            <p style="margin-top: 0.5rem; opacity: 0.5;">MCP Server v3.2.0</p>
        </footer>
    </main>

    <script>
        function togglePassword() {
            const input = document.getElementById('magentoToken');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            const btn = document.getElementById('submitBtn');
            btn.classList.add('btn-loading');
            btn.disabled = true;
        });

        window.addEventListener('pageshow', function(e) {
            const btn = document.getElementById('submitBtn');
            btn.classList.remove('btn-loading');
            btn.disabled = false;
        });

        document.getElementById('baseUrl').focus();
    </script>
</body>
</html>
